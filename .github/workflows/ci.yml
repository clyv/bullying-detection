name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # CPU-only torch keeps CI GPU-free and fast; ultralytics is still imported
      # lazily in the source so it never needs installing here.
      # Linters come from requirements-dev.txt so that a developer running
      # `pip install -r requirements-dev.txt` gets byte-identical versions.
      # Pinning ruff only here let a local copy drift to 0.15 and report a clean
      # tree while CI, on 0.16, found 36 errors in code nobody had touched.
      - run: pip install -r requirements-dev.txt
      # scikit-learn backs the WindowHazard baseline, which every learned
      # anticipation model has to beat. Leaving it out skips the one test that
      # checks the bar still works.
      - run: pip install numpy pyyaml scikit-learn
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v
