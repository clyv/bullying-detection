# Phase 4 — unified aggressive-vs-neutral model across all datasets.
# Each dataset's native classes are collapsed to binary via src/datasets/taxonomy.py.
experiment: phase4_unified

data:
  num_frames: 64
  max_persons: 2
  val_frac: 0.15
  test_frac: 0.15
  # Center+scale each skeleton per clip so the three datasets' different camera
  # resolutions share one space — essential for cross-dataset transfer.
  normalize: true
  datasets:
    - {name: ut_interaction, cache: outputs/ut_poses}
    - {name: bullying10k,    cache: outputs/b10k_poses}
    - {name: ntu,            cache: outputs/ntu_poses}
    # Real-surveillance fights + normal-CCTV hard negatives (skipped if absent):
    - {name: ubi_fights,     cache: outputs/ubi_poses}
    - {name: fight_surv,     cache: outputs/fightsurv_poses}  # 300 real surveillance clips

model:
  # 'agcn' = learnable graph topology + multi-scale temporal conv (src/models/agcn.py).
  # Set to 'stgcn' to reproduce the Phase 1-4 baseline numbers.
  name: agcn
  num_classes: 2
  class_names: [neutral, aggressive]
  graph: coco17
  in_channels: 3
  dropout: 0.3
  base_channels: 64
  adaptive: true

training:
  batch_size: 16
  epochs: 40
  lr: 0.01
  weight_decay: 0.0001
  device: cuda
  seed: 42
  # Focal loss instead of cross-entropy: CE is what drove P(aggressive)=1.000 on
  # real footage. gamma=0 falls back to plain CE for the ablation.
  focal_gamma: 2.0
  label_smoothing: 0.05
  class_balanced: true   # inverse-frequency weights; the pooled corpus is skewed
  warmup_epochs: 3       # the adaptive adjacency is unstable at full LR from step 0
  clip_grad: 1.0
  mixup_alpha: 0.0       # >0 enables skeleton mixup (disables focal loss that epoch)

# Training-split-only augmentation. Chosen against measured failure modes rather
# than generically: joint_dropout simulates the missing keypoints YOLO-Pose returns
# at range, temporal_crop breaks each corpus's action-trimming convention, and
# scale_jitter stops the model assuming normalization was perfect.
augment:
  joint_dropout: 0.1
  person_dropout: 0.05
  coord_noise: 0.02
  flip_prob: 0.5
  person_swap_prob: 0.5
  temporal_crop: 0.2
  scale_jitter: 0.2
  rotate_degrees: 15.0
  shear: 0.1

# Phase 5 — sliding-window temporal localization on a continuous stream.
localization:
  window: 64        # frames per window (match training num_frames)
  stride: 16        # hop between windows; smaller = finer temporal resolution
  threshold: 0.5    # aggression probability above which a window is flagged
  max_gap: 16       # merge incidents separated by <= this many frames

# Crowd scenes (visualize.py with >2 tracked people): the 2-person model scans
# every interacting pair; crowd-pressure spikes catch sudden gatherings the
# pose model can't see into (victim occluded under the crowd).
crowd:
  max_persons: 16      # people tracked during pose extraction
  # Pose-quality gate: the classifier only votes on pairs whose skeletons are
  # at least this tall (px). On tiny far-away people its output is jitter noise
  # (measured: ~80px CCTV crowd vs ~174px UT training-like footage), so below
  # the gate the model abstains and the activity heuristics carry the frame.
  min_pair_height: 120
  pressure_weight: 1.5 # scale on crowd-convergence spikes blended into activity
  baseline_seconds: 10 # trailing window defining "normal" crowd density
  # Heuristic HIGH ACTIVITY signal (labelled distinctly from model AGGRESSION):
  # most-agitated-person motion in skeleton-heights/frame, ramped to a score
  # between floor and saturate. Calibrated on 30fps school CCTV.
  motion_floor: 0.5
  motion_saturate: 2.0
  motion_weight: 0.9
  smooth_seconds: 0.5
  crowd_aware: true # score nearby two-person pairs instead of diluting crowds
  max_pairs: 24     # closest candidate pairs scored per window
  pose_max_persons: 12 # keep more people for crowd videos; model still scores pairs
  focus_percentile: 90 # show the strongest crowd-pressure moments, not the whole clip
  focus_min_threshold: 0.65
  focus_max_gap: 120   # join close bursts within the same confrontation
  focus_top_incidents: 1
  target_white_shirt: true # follow upper-frame white-shirt target pressure
  target_weight: 0.25
  target_smooth_frames: 90
  target_keep_early_before: 30
  target_keep_padding: 45
  target_keep_percentile: 80
